# Opinionated Herdr config.
# Mouse still works for panes, tabs, the sidebar, splits, and copy.

onboarding = false

[theme]
name = "catppuccin"

[ui]
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "datetime", format = "%Y-%m-%d %H:%M" },
]
tab_bar_right_separator = " | "

[keys]
prefix = "ctrl+a"

# Tabs: Shift-arrows skip the prefix. prefix+p / prefix+n still work.
previous_tab = ["shift+left", "prefix+p"]
next_tab = ["shift+right", "prefix+n"]

# Rename the current tab. prefix+shift+t is Herdr's default, kept as a spare.
rename_tab = ["prefix+comma", "prefix+shift+t"]

# Spaces picker. cmd+e is one chord; the outer terminal must not swallow it.
# Fallbacks: ctrl+alt+w, prefix+w.
workspace_picker = ["cmd+e", "ctrl+alt+w", "prefix+w"]

# Inside the picker only (does not steal keys from the pane).
# Spaces are a vertical list: j/k (and arrows).
# Unbind pane hjkl so those keys are not split with the space list.
navigate_workspace_up = ["k", "up"]
navigate_workspace_down = ["j", "down"]
navigate_pane_left = ""
navigate_pane_down = ""
navigate_pane_up = ""
navigate_pane_right = ""

[ui.toast]
delivery = "herdr"
